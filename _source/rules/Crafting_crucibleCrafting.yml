_id: crucibleCrafting
name: Crafting
pages:
  - sort: 100000
    name: Alchemy
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: alchemy000000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Alchemy</strong> reduces botanicals and minerals to their
        virtues and recombines them into something which can be drunk, smeared
        upon a blade, or thrown. Its products are consumables, made to be spent
        rather than kept, and its practitioners refine the reagents other trades
        depend upon once their work rises past Standard quality.</p><section
        class="gameplay"><p>Everything is a mixture, and a patient hand may take
        it apart and put it back together with its virtues rearranged. That is
        the whole of the art. The rest is heat, time, and exact proportion. A
        still that drips with measured slowness, minerals ground to finest
        powder, heat applied intensely until the exact moment a solution turns
        color and is perfected. Nothing we make is meant to last, only to
        change.</p><p>- Ysolde Marrant, alchemist, in her opening
        lecture</p></section><p>Alchemy checks are scaled by
        <strong>Intellect</strong> and <strong>Toughness</strong>: the learning
        to know what a reaction will do, and the constitution to breathe the
        fumes while finding out. Field work requires an
        @UUID[Compendium.crucible.equipment.Item.alchemistsToolki]{Alchemist's
        Toolkit} carried in your Toolbelt. Anything more demanding wants a
        laboratory, or an
        @UUID[Compendium.crucible.equipment.Item.alchemistsPortab]{Alchemist's
        Portable Workbench} standing in for one.</p><h4>Example
        Products</h4><p>Among many other products, an alchemist may
        create:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.healingTonic0000]{Healing
        Tonic} and
        @UUID[Compendium.crucible.equipment.Item.healingElixir000]{Healing
        Elixir}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.antitoxin0000000]{Antitoxin}
        and @UUID[Compendium.crucible.equipment.Item.omniglotDecoctio]{Omniglot
        Decoction}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.alchemistsFire00]{Alchemist's
        Fire}, @UUID[Compendium.crucible.equipment.Item.KdlUUFhAnpv6YIHT]{Blast
        Flask}, and
        @UUID[Compendium.crucible.equipment.Item.frostdropFlask00]{Frostdrop
        Phial}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.lanternOil000000]{Lantern
        Oil} and other refined stock</p></li><li><p>More examples as the
        crafting system matures.</p></li></ul><h2
        class="divider">Improvisational Alchemy</h2><p>While not required to use
        the Alchemy skill, the <strong>Wortcunning</strong> talent provides an
        aspiring alchemist with added versatility that enables Alchemy to be
        used for a wider variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.wortcunning00000
        inline]</p>
