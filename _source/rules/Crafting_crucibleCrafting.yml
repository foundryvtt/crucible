  - sort: 400000
    name: Fletching
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: fletching0000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Fletching</strong> is the working of wood. It is best known
        for bows and their ammunition, but extends to every wooden implement a
        company carries: staves and cudgels, light shields, wooden talismans,
        and the seasoned stock other crafters require. Where a piece is mostly
        wood it is a fletcher's work, and a cracked stave comes back to the
        fletcher to be @UUID[.repair0000000000]{repaired}.</p><section
        class="gameplay"><p>Wood is not uniform, nor does it behave as if it
        were. That is the first thing you must unlearn. Read the stave before
        you cut it. Find where the grain runs true, where a knot will throw a
        shaft off its line, how long a length of ash must season before it can
        be trusted to hold a draw. A masterfully crafted bow deserves its
        reputation, but this is no mere archer's trade. You will spend your
        careers making everything from wheels to shields.</p><p>- Hesken Dray,
        bowyer</p></section><p>Fletching checks are scaled by
        <strong>Strength</strong> and <strong>Wisdom</strong>: the arms to work
        a stave, and the eye to know which one is worth working. Field work
        requires a
        @UUID[Compendium.crucible.equipment.Item.fletchersToolkit]{Fletcher's
        Toolkit} carried in your Toolbelt. Shaping a bow properly wants a
        workshop.</p><h4>Example Products</h4><p>Among many others, a fletcher
        makes:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.longbow000000000]{Longbow},
        @UUID[Compendium.crucible.equipment.Item.shortbow00000000]{Shortbow},
        and @UUID[Compendium.crucible.equipment.Item.handCrossbow0000]{Hand
        Crossbow}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.quarterstaff0000]{Quarterstaff},
        @UUID[Compendium.crucible.equipment.Item.boStaff000000000]{Bo Staff},
        and
        @UUID[Compendium.crucible.equipment.Item.greatclub0000000]{Greatclub}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.buckler000000000]{Buckler}
        and @UUID[Compendium.crucible.equipment.Item.roundShield00000]{Round
        Shield}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.flameStaff000000]{Flame
        Staff} and other wooden talismans</p></li><li><p>More examples as the
        crafting system matures.</p></li></ul><h2
        class="divider">Improvisational Fletching</h2><p>While not required to
        use the Fletching skill, the <strong>Grainwork</strong> talent provides
        an aspiring fletcher with added versatility that enables Fletching to be
        used for a wider variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.grainwork0000000
        inline]</p>
