  - sort: 300000
    name: Enchanting
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: enchanting000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Enchanting</strong> binds a Glyph into a finished object so
        that it holds a magical property permanently. An enchanter makes nothing
        alone, depending upon a glyphweaver for the Glyph and upon another
        crafter for a base item fine enough to hold it.</p><section
        class="gameplay"><p>We are the final hands to touch a blade or armor,
        transforming it from a work of masterful craftsmanship into a legendary
        artifact whose powers will alter the course of history. The work is a
        binding, and that binding requires persuasive negotiation with arcane
        forces that govern the universe. When a glyph is imbued it becomes
        permanent; when the ritual fails precious materials are lost. If you pay
        attention, you will delight your patrons. If you are lax, your failure
        will infuriate them.</p><p>- Callem Ternes, court
        enchanter</p></section><p>Enchanting makes nothing of its own. The Glyph
        comes from a @UUID[.glyphweaving0000]{Glyphweaver} and the item beneath
        it from a @UUID[.smithing00000000]{Smith},
        @UUID[.tailoring0000000]{Tailor}, @UUID[.fletching0000000]{Fletcher}, or
        @UUID[.jewelcraft000000]{Jewelcrafter}. Only work of
        <strong>Fine</strong> quality or better will hold an enchantment at all,
        and the finer the piece the more it can carry before it is
        full.</p><p>Enchanting checks are scaled by <strong>Intellect</strong>
        and <strong>Presence</strong>: the study to understand what a Glyph will
        do, and the force of self to make it stay. Field work requires an
        @UUID[Compendium.crucible.equipment.Item.enchantersToolki]{Enchanter's
        Toolkit} carried in your Toolbelt. Binding of any permanence wants a
        sanctum, or an
        @UUID[Compendium.crucible.equipment.Item.enchantersPortab]{Enchanter's
        Portable Workbench} standing in for one.</p><h4>Example
        Products</h4><p>Among many other products, an enchanter may
        create:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.amuletOfNimblene]{Amulet
        of Nimbleness} and
        @UUID[Compendium.crucible.equipment.Item.ringOfEvasion000]{Ring of
        Evasion}, from a jewelcrafter's
        work</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.cloakOfKindlyVis]{Cloak
        of Kindly Visage}, from a tailor's
        work</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.flameStaff000000]{Flame
        Staff}, from a fletcher's work</p></li><li><p>More examples as the
        crafting system matures.</p></li></ul><h2
        class="divider">Improvisational Enchanting</h2><p>While not required to
        use the Enchanting skill, the <strong>Quickening</strong> talent
        provides an aspiring enchanter with added versatility that enables
        Enchanting to be used for a wider variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.quickening000000
        inline]</p>
