  - sort: 800000
    name: Tailoring
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: tailoring0000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Tailoring</strong> works fabric, fur and leather. It covers
        cloth and leather armor and clothing of every kind, but reaches far past
        what is worn: packs and boots, belts and straps, scabbards and grips are
        all a tailor's work. Treated leather is a tailor's own to supply, and
        torn work returns to the tailor to be
        @UUID[.repair0000000000]{mended}.</p><section class="gameplay"><p>The
        experience one has in this world is conditioned on their manners. The
        attire in which you garb yourself is the most outward pronouncement of
        those manners possible. Your dress precedes your demeanor and your
        words; either reinforcing your position or sabotaging it. From kings to
        paupers, all have need of a tailor's art whether they realize it or not.
        And yes, I am measuring you from across this room, and I have already
        decided what you ought to be wearing instead.</p><p>- Emeraude Fisk,
        tailor</p></section><p>Tailoring checks are scaled by
        <strong>Dexterity</strong> and <strong>Presence</strong>: the fingers to
        set a stitch nobody can see, and the sense of how a thing ought to look
        on the person wearing it. Field work requires a
        @UUID[Compendium.crucible.equipment.Item.tailorsToolkit00]{Tailor's
        Toolkit} carried in your Toolbelt. Cutting a garment from bolt cloth
        wants a bench, or a
        @UUID[Compendium.crucible.equipment.Item.tailorsPortableW]{Tailor's
        Portable Workbench} standing in for one.</p><h4>Example
        Products</h4><p>Among many others, a tailor
        makes:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.leatherArmor0000]{Leather
        Armor},
        @UUID[Compendium.crucible.equipment.Item.studdedLeatherAr]{Studded
        Leather Armor}, and
        @UUID[Compendium.crucible.equipment.Item.paddedArmor00000]{Padded
        Armor}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.commonClothing00]{Common
        Clothing} and
        @UUID[Compendium.crucible.equipment.Item.weatherClothing0]{Weather
        Clothing}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.cloak00000000000]{Cloak},
        @UUID[Compendium.crucible.equipment.Item.belt000000000000]{Belt}, and
        @UUID[Compendium.crucible.equipment.Item.bracer0000000000]{Bracer}</p></li><li><p>Treated
        leather, as an ingredient for other trades</p></li><li><p>More examples
        as the crafting system matures.</p></li></ul><h2
        class="divider">Improvisational Tailoring</h2><p>While not required to
        use the Tailoring skill, the <strong>Whipstitch</strong> talent provides
        an aspiring tailor with added versatility that enables Tailoring to be
        used for a wider variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.whipstitch000000
        inline]</p>
