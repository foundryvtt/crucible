  - sort: 500000
    name: Jewelcraft
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: jewelcraft000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Jewelcraft</strong> is the cutting of stones and the raising
        of settings to hold them. Its products are rings, amulets and other
        ornaments worn in an accessory slot, along with the cut gems other
        trades require for their finest work. Any magic in a gem was put there
        by an enchanter. A parted setting is the jewelcrafter's to
        @UUID[.repair0000000000]{repair}.</p><section class="gameplay"><p>We
        work at a scale where a hair's breadth is a visible error. Read the
        rough stone for the flaw which will either ruin it or, struck at exactly
        the correct angle, release the shape waiting inside. Then raise a
        setting fine enough to flatter what you have freed and strong enough
        that it never moves again. Your creations may adorn the brow of rulers
        or be passed through a family for generations. Ours is the most patient
        of trades and your work will hold meaning far longer than you draw
        breath.</p><p>- Aurelie Sondt, lapidary</p></section><p>Jewelcraft
        checks are scaled by <strong>Wisdom</strong> and
        <strong>Strength</strong>: the discernment to see what a stone will
        become, and the steadiness to hold a tool against it for hours. Field
        work requires a
        @UUID[Compendium.crucible.equipment.Item.jewelersToolkit0]{Jeweler's
        Toolkit} carried in your Toolbelt. Cutting and setting want a bench, or
        a @UUID[Compendium.crucible.equipment.Item.jewelersPortable]{Jeweler's
        Portable Workbench} standing in for one.</p><h4>Example
        Products</h4><p>Among many others, a jewelcrafter
        makes:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.ring000000000000]{Ring}
        and
        @UUID[Compendium.crucible.equipment.Item.amulet0000000000]{Amulet}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.spellband0000000]{Spellband}
        and @UUID[Compendium.crucible.equipment.Item.focusingPearl000]{Focusing
        Pearl}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.gemOfIlluminatio]{Gem
        of Illumination} and similar trinkets</p></li><li><p>Cut gems and
        stones, as ingredients for other trades</p></li><li><p>More examples as
        the crafting system matures.</p></li></ul><h2
        class="divider">Improvisational Jewelcraft</h2><p>While not required to
        use the Jewelcraft skill, the <strong>Filigree</strong> talent provides
        an aspiring jewelcrafter with added versatility that enables Jewelcraft
        to be used for a wider variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.filigree00000000
        inline]</p>
