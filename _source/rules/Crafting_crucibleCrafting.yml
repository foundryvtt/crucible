  - sort: 700000
    name: Smithing
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: smithing00000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Smithing</strong> is the working of base metals and alloys
        into arms and armor. A smith produces metal weapons of every category,
        metal armor and heavy shields, and is the trade a company relies upon
        most directly when a fight goes badly.</p><section
        class="gameplay"><p>Our work begins as a dull ingot and ends with a
        gleaming edge. Heat and repetition, the simplest recipe and yet few can
        master its technique. The difference between a blade which holds and one
        which shatters was decided long before anybody unsheathes it. No craft
        has stakes as vital as ours. As you forge the metal, so too will you
        forge a reputation as either a savior whose work is to be prized or a
        charlatan whose slag can never be trusted.</p><p>- Duregar Molt,
        smith</p></section><p>Smithing also answers for any talisman cut from
        metal. At the higher grades the work stops being solitary: a masterwork
        blade wants a tailor's treated leather at the grip and a jewelcrafter's
        cut stone in the pommel. Metal that breaks is a smith's to
        @UUID[.repair0000000000]{mend}.</p><p>Smithing checks are scaled by
        <strong>Strength</strong> and <strong>Intellect</strong>: the power to
        move metal, and the understanding of what the heat has done to it. Field
        work requires a
        @UUID[Compendium.crucible.equipment.Item.smithsToolkit000]{Smith's
        Toolkit} carried in your Toolbelt. Forging wants a proper forge, or a
        @UUID[Compendium.crucible.equipment.Item.smithsPortableFo]{Smith's
        Portable Forge} standing in for one.</p><h4>Example
        Products</h4><p>Among many others, a smith
        makes:</p><ul><li><p>@UUID[Compendium.crucible.equipment.Item.longsword0000000]{Longsword},
        @UUID[Compendium.crucible.equipment.Item.greatsword000000]{Greatsword},
        and @UUID[Compendium.crucible.equipment.Item.battleAxe0000000]{Battle
        Axe}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.chainMail0000000]{Chain
        Mail} and
        @UUID[Compendium.crucible.equipment.Item.plateMail0000000]{Plate
        Mail}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.kiteShield000000]{Kite
        Shield} and
        @UUID[Compendium.crucible.equipment.Item.towerShield00000]{Tower
        Shield}</p></li><li><p>Ingots and metal fittings, as ingredients for
        other trades</p></li><li><p>More examples as the crafting system
        matures.</p></li></ul><h2 class="divider">Improvisational
        Smithing</h2><p>While not required to use the Smithing skill, the
        <strong>Coldwork</strong> talent provides an aspiring smith with added
        versatility that enables Smithing to be used for a wider variety of
        improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.coldwork00000000
        inline]</p>
