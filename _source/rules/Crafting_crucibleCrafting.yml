  - sort: 600000
    name: Glyphweaving
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: glyphweaving0000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Glyphweaving</strong> inscribes a metaphysical
        @UUID[Compendium.crucible.rules.JournalEntry.qjTSKlh59JhtUuEr.JournalEntryPage.p3hKRiZN3x0DEtyG]{Rune}
        into a physical Glyph which can be carried, traded, and eventually bound
        into equipment. The same discipline governs mundane inscription: letters
        and records, painted work, and the spell scrolls a caster
        spends.</p><section class="gameplay"><p>Mages will weave Runes and
        Gestures into works of spellcraft that can carry incredible power, but
        their work is only ever temporary. A glyphweaver forms those threads
        into a body through the art of inscription. We trace lines in chalk,
        ink, metal, and mineral that allow magic to bind. What results is a
        strange thing; weighing almost nothing and inert to the senses, but
        replete with the power of great magic, waiting to be imbued. Ours is the
        quiet art that gives magic physical form, and without our weaving the
        glorified enchanters of the world would be nothing but impotent
        mystics.</p><p>- Nerith Vaugh, glyphweaver</p></section><p>Glyphweaving
        also answers for inscription with no magic in it whatsoever: letters and
        records, painted and lettered work, and the spell scrolls a caster reads
        once and spends. A Glyph does nothing on its own; an
        @UUID[.enchanting000000]{Enchanter} binds it into equipment, or a ritual
        consumes it instead.</p><p>Glyphweaving checks are scaled by
        <strong>Presence</strong> and <strong>Dexterity</strong>: the will to
        hold a Rune steady in the mind, and the hand to lay it down without a
        tremor. Field work requires a
        @UUID[Compendium.crucible.equipment.Item.glyphweaversTool]{Glyphweaver's
        Toolkit} carried in your Toolbelt. Work of any permanence wants a
        scriptorium, or a
        @UUID[Compendium.crucible.equipment.Item.glyphweaversPort]{Glyphweaver's
        Portable Workbench} standing in for one.</p><h4>Example
        Products</h4><p>Among many others, a glyphweaver
        makes:</p><ul><li><p>Glyphs, each holding one affix in
        waiting</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.spellScrollFine0]{Spell
        Scroll (Fine)} and its finer
        grades</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.ink0000000000000]{Ink}
        and other inscribing stock</p></li><li><p>Letters, ledgers, maps, and
        painted work</p></li><li><p>More examples as the crafting system
        matures.</p></li></ul><h2 class="divider">Improvisational
        Glyphweaving</h2><p>While not required to use the Glyphweaving skill,
        the <strong>Tracery</strong> talent provides an aspiring glyphweaver
        with added versatility that enables Glyphweaving to be used for a wider
        variety of improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.tracery000000000
        inline]</p>
