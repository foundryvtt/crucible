  - sort: 0
    name: Trade Skills Overview
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: tradeskillsOverv
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Crafting</strong> in Crucible is performed using a set of
        <strong>Trade Skills</strong> which, like adventuring
        @UUID[Compendium.crucible.rules.JournalEntry.characterMechani.JournalEntryPage.skills0000000000]{Skills},
        are invested aspects of your character's identity obtained through
        @UUID[Compendium.crucible.rules.JournalEntry.characterMechani.JournalEntryPage.talents000000000]{Talent}
        progression and through the accumulation of knowledge in the form of
        @UUID[Compendium.crucible.rules.JournalEntry.crucibleCrafting.JournalEntryPage.schematicDefinit]{Schematics}.</p>

        <section class="construction">
            <p>The crafting system is under active development. Rules described here represent the intended design, but some details may not yet be fully automated.</p>
        </section>

        <section class="gameplay">
            <p>It is not required for any character to invest into mastery of a Trade Skill, however it is generally recommended to select at least one Trade Skill to pursue in order to enjoy a well-rounded experience playing Crucible, particularly if your game is a long-form campaign.</p>
        </section>

        <p>The information in this journal describes each of the Trade Skills,
        how schematics are defined and obtained, and how the crafting process
        functions when using a schematic to turn input ingredients into produced
        items.</p>

        <h2 class="divider">Trade Skills Table</h2>

        <p>Your <strong>Ability Bonus</strong> with every Trade Skill is
        governed by a pair of ability scores and oversees a certain domain of
        materials and products which they create.</p>

        <table>
            <tbody>
                <tr>
                    <th>
                        <p>Skill</p>
                    </th>
                    <th colspan="2">
                        <p>Ability Scores</p>
                    </th>
                    <th>
                        <p>General Usage</p>
                    </th>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.alchemy000000000]</p>
                    </td>
                    <td>
                        <p>Intellect</p>
                    </td>
                    <td>
                        <p>Toughness</p>
                    </td>
                    <td>
                        <p>Potions, elixirs, oils, and bombs</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.cooking000000000]</p>
                    </td>
                    <td>
                        <p>Wisdom</p>
                    </td>
                    <td>
                        <p>Toughness</p>
                    </td>
                    <td>
                        <p>Meals, poisons, and drugs</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.enchanting000000]</p>
                    </td>
                    <td>
                        <p>Intellect</p>
                    </td>
                    <td>
                        <p>Presence</p>
                    </td>
                    <td>
                        <p>Imbuing glyphs onto equipment</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.fletching0000000]</p>
                    </td>
                    <td>
                        <p>Strength</p>
                    </td>
                    <td>
                        <p>Wisdom</p>
                    </td>
                    <td>
                        <p>Bows, wooden arms, and light shields</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.jewelcraft000000]</p>
                    </td>
                    <td>
                        <p>Wisdom</p>
                    </td>
                    <td>
                        <p>Strength</p>
                    </td>
                    <td>
                        <p>Jewelry, accessories, and cut stones</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.glyphweaving0000]</p>
                    </td>
                    <td>
                        <p>Presence</p>
                    </td>
                    <td>
                        <p>Dexterity</p>
                    </td>
                    <td>
                        <p>Inscription of glyphs</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.smithing00000000]</p>
                    </td>
                    <td>
                        <p>Strength</p>
                    </td>
                    <td>
                        <p>Intellect</p>
                    </td>
                    <td>
                        <p>Metal arms, armor, and heavy shields</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.tailoring0000000]</p>
                    </td>
                    <td>
                        <p>Dexterity</p>
                    </td>
                    <td>
                        <p>Presence</p>
                    </td>
                    <td>
                        <p>Cloth and leather goods</p>
                    </td>
                </tr>
            </tbody>
        </table>

        <h2 class="divider">Domains of Responsibility</h2>

        <p>Each trade occupies a territory of its own, some create base
        equipment that is worn or wielded, while others create supporting goods
        that are helpful for adventurers during their travels. Every trade
        produces intermediate outputs that are used by other trades as inputs to
        advanced recipes. Every physical item in the game is designated as being
        produced by one specific trade skill.</p>

        <table>
            <tbody>
                <tr>
                    <th>
                        <p>Skill</p>
                    </th>
                    <th>
                        <p>Inputs</p>
                    </th>
                    <th>
                        <p>Outputs</p>
                    </th>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.alchemy000000000]</p>
                    </td>
                    <td>
                        <p>Botanical, chemical, and mineral reagents</p>
                    </td>
                    <td>
                        <p>Potions and elixirs, weapon oils, thrown flasks and bombs, refined reagents</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.cooking000000000]</p>
                    </td>
                    <td>
                        <p>Meats, vegetables, spices, and other organic ingredients</p>
                    </td>
                    <td>
                        <p>Meals eaten during a Rest, poisons applied to a weapon, drugs taken for a short and costly burst</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.enchanting000000]</p>
                    </td>
                    <td>
                        <p>Glyphs inscribed by a Glyphweaver and arcane solvents to imbue them</p>
                    </td>
                    <td>
                        <p>Magical effects imbued into equipment as Affixes</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.fletching0000000]</p>
                    </td>
                    <td>
                        <p>Wood, lumber, refined metal, treated leather, woven cloth, ornamental inputs</p>
                    </td>
                    <td>
                        <p>Bows and crossbows, arrows and bolts, quarterstaves, cudgels and mauls, light shields, wooden talismans, seasoned wood for other trades.</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.glyphweaving0000]</p>
                    </td>
                    <td>
                        <p>Spellcraft runes and magical chalks, inks, fabrics, and dyes</p>
                    </td>
                    <td>
                        <p>Glyphs, and inscribed or painted work carrying no magic at all</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.jewelcraft000000]</p>
                    </td>
                    <td>
                        <p>Uncut gemstones, refined metal, treated leather, woven cloth</p>
                    </td>
                    <td>
                        <p>Rings, amulets, pendants and ornaments, certain talismans, and ornamental inputs for other trades.</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.smithing00000000]</p>
                    </td>
                    <td>
                        <p>Unrefined metal, refined ingots, seasoned wood, treated leather, woven cloth, ornamental inputs</p>
                    </td>
                    <td>
                        <p>Metal weapons of every category, metal armor, heavy shields, metal talismans, ingots</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>@UUID[.tailoring0000000]</p>
                    </td>
                    <td>
                        <p>Bolts of cloth, untreated leather, decorative metal, ornamental inputs.</p>
                    </td>
                    <td>
                        <p>Cloth and leather armor, clothing, packs, boots, belts, straps, scabbards, grips, treated leather</p>
                    </td>
                </tr>
            </tbody>
        </table>
