  - sort: 200000
    name: Cooking
    type: text
    category: UaoYAtq1fyu6uiPf
    _id: cooking000000000
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Cooking</strong> is the trade of what goes into people: the
        meals which carry a company from one hardship to the next, and also the
        poisons and drugs which do nothing of the sort. A cook produces all
        three; anyone at all may use them.</p><section class="gameplay"><p>Fire,
        patience, and knowing how to pair ingredients. Which cuts reward long
        heat, which herbs turn bitter if boiled, how a sack of provisions
        transforms into a memorable meal. Alongside the knowledge of how to
        delight the palate run darker currents — there is no place easier than
        beneath the savory aroma of a stew to conceal a nefarious
        ingredient.</p><p>- Bregan Oale, kitchenmaster, to his
        apprentices</p></section><p>Cooking checks are scaled by
        <strong>Wisdom</strong> and <strong>Toughness</strong>: the judgment to
        know when a thing is ready, and the stomach to taste what you are not
        yet sure of. Field work requires a
        @UUID[Compendium.crucible.equipment.Item.cooksToolkit0000]{Cook's
        Toolkit} carried in your Toolbelt, which is enough for a campfire.
        Ambitious work requires a proper kitchen.</p><h4>Example
        Products</h4><p>Among many other products, a cook may
        create:</p><ul><li><p>Meals prepared and eaten during a
        Rest</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.rations000000000]{Rations}
        for the
        road</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.poisonVial000000]{Poison
        Vial}</p></li><li><p>@UUID[Compendium.crucible.equipment.Item.paralyticVial000]{Paralytic
        Vial}</p></li><li><p>More examples as the crafting system
        matures.</p></li></ul><h2 class="divider">Improvisational
        Cooking</h2><p>While not required to use the Cooking skill, the
        <strong>Hearthwork</strong> talent provides an aspiring cook with added
        versatility that enables Cooking to be used for a wider variety of
        improvisational
        uses.</p><p>@Embed[Compendium.crucible.talent.Item.hearthwork000000
        inline]</p>
