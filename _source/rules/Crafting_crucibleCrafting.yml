  - sort: 950000
    name: Ingredients
    type: text
    category: UbGiQAlGSH8iwZhE
    _id: obtainingIngredi
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Ingredients</strong> are the components required by
        @UUID[Compendium.crucible.rules.JournalEntry.crucibleCrafting.JournalEntryPage.schematicDefinit]{Schematics}
        in order to produce a physical output. Ingredients can differ in terms
        of quality and enchantment tier, and each ingredient can have a variety
        of properties that contribute to the overall quality of the crafted
        output.</p><p></p>
