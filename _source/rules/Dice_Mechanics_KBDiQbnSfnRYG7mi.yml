pages:
  - name: Dice Mechanics
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <p>Crucible uses the standard set of role-playing game dice; relying
        upon 4, 6, 8, 10, 12, and 20-sided dice for various rolls. These dice
        are referred to as <strong>d4</strong>, <strong>d6</strong>,
        <strong>d8</strong>, <strong>d10</strong>, and <strong>d12</strong>,
        where a number that precedes the die type represents the quantity of
        that die to roll, for example <strong>4d6</strong> provides instruction
        to roll four six-sided dice.</p><blockquote><p>Crucible is designed
        specifically for Foundry Virtual Tabletop, but its dice mechanics are
        possible to play outside of a digital environment, albeit with a fairly
        high level of bookkeeping required.</p></blockquote><p>When your
        character performs heroic actions within the world, whether they be
        feats of martial prowess or clever social maneuvers, the outcomes of the
        attempted action are discovered by rolling dice.</p><h2
        class="divider">Standard Check</h2><div data-rule="dice.check"><p>The
        standard approach towards determining the outcome of a dice check in
        Crucible uses a dice pool comprised of three dice, typically 3d8, which
        are added together. The exact dice used in the pool are modified
        depending on the @Rule[dice.boon]{Boons} or @Rule[dice.bane]{Banes}
        which apply to the roll. Added to the result of these three dice are
        Ability, Skill, and Enchantment bonuses which further increase the value
        of the result. This type of dice roll is referred to as a
        <strong>Standard Check</strong>.</p><section class="formula"><p
        class="value">Standard Check</p><p class="equals">=</p><p
        class="equation">3d8[Boons,Banes] + Ability Bonus + Skill Bonus +
        Enchantment Bonus</p></section></div><h2 class="divider">Check
        Results</h2><p>Every check is made against a <strong>Difficulty
        Class</strong> (<strong>DC</strong>). Once the dice are rolled, the
        check's total is compared against the DC to determine whether it
        succeeds or fails, and whether that result is
        critical.</p><dl><dt><p>Success</p></dt><dd
        data-rule="dice.success"><p>If the check's total is <strong>greater
        than</strong> the DC, the check is a
        <strong>Success</strong>.</p></dd><dt><p>Failure</p></dt><dd
        data-rule="dice.failure"><p>If the check's total is <strong>equal to or
        less than</strong> the DC, the check is a
        <strong>Failure</strong>.</p></dd><dt><p>Critical Success</p></dt><dd
        data-rule="dice.criticalSuccess"><p>If the check's total exceeds the DC
        by <strong>more than</strong> the @Rule[dice.criticalSuccessThreshold]
        (6 by default), the check is a <strong>Critical Success</strong>. A
        Critical Success is also a @Rule[dice.success]; some Actions, Talents,
        and effects grant additional benefits on a Critical
        Success.</p></dd><dt><p>Critical Failure</p></dt><dd
        data-rule="dice.criticalFailure"><p>If the check's total falls short of
        the DC by the @Rule[dice.criticalFailureThreshold] <strong>or
        more</strong> (6 by default), the check is a <strong>Critical
        Failure</strong>. A Critical Failure is also a @Rule[dice.failure]; some
        Actions, Talents, and effects impose additional consequences on a
        Critical Failure.</p></dd></dl><p>Two thresholds determine how far a
        check must beat or miss its DC for the result to be
        critical:</p><dl><dt><p>Critical Success Threshold</p></dt><dd
        data-rule="dice.criticalSuccessThreshold"><p>A check is a
        @Rule[dice.criticalSuccess] when its total exceeds its DC by more than
        this number. It is 6 by default and can be modified by Talents, weapon
        properties, enchantments, and certain Actions.</p></dd><dt><p>Critical
        Failure Threshold</p></dt><dd
        data-rule="dice.criticalFailureThreshold"><p>A check is a
        @Rule[dice.criticalFailure] when its total falls short of its DC by this
        number or more. It is 6 by default and can be modified by certain
        enchantments.</p></dd></dl><h2 class="divider">Bonus Stacking</h2><p>Any
        given roll may only have one source of <strong>Ability Bonus</strong>,
        <strong>Skill Bonus</strong>, or <strong>Enchantment Bonus</strong>. If
        certain Actions, Talents, or Equipment provide multiple methods of
        obtaining a bonus for a roll, only the largest bonus is
        used.</p><section class="gameplay"><h4>Example: Multiple Enchantment
        Bonuses</h4><p>Zarajah is an accomplished spellcaster who has obtained
        several powerful artifacts. A set of mages robes that provide a +1
        Enchantment Bonus to all
        @UUID[Compendium.crucible.rules.JournalEntry.qjTSKlh59JhtUuEr]{Spellcraft},
        and a powerful staff which gives a +2 Enchantment Bonus to spells cast
        using @UUID[Compendium.crucible.talent.Item.runeFlame0000000]{Rune:
        Flame}. When casting a spell using the Earth rune, Zarajah has a +1
        Enchantment Bonus on any dice roll involved that spell. When casting a
        spell using the Flame rune, Zarajah has a +2 Enchantment
        Bonus.</p></section>
