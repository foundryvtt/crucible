  - name: Wortcunning
    type: talent
    img: icons/tools/laboratory/bowl-herbs-green.webp
    system:
      description: >-
        <p>You know what things are made of. Years at the still and the mortar
        have taught you to draw an essence out of a root, and to read what
        another hand has put into a flask.</p>
      actions:
        - id: wortcunning
          name: Wortcunning
          img: icons/tools/laboratory/bowl-herbs-green.webp
          condition: You have an Alchemist's Toolkit equipped.
          description: >-
            <p>Every preparation leaves its signature. With an Alchemist's
            Toolkit equipped, you can produce any one of the following
            effects:</p><ul><li><p><strong>Read.</strong> You study an item
            created by alchemy which you can handle, learning its
            <strong>Quality</strong> tier, what it will do, and whether it has
            degraded past use. From residue alone, a stain, a shattered flask, a
            scorch on stone, you identify what was prepared there if you know
            its recipe.</p></li><li><p><strong>Destroy.</strong> You spend 10
            minutes to spoil a non-magical item created by alchemy which you can
            physically touch, leaving a potion inert and a bomb a dud.
            Alternatively, in the course of preparing such a work yourself, you
            may leave it appearing sound while ensuring it does nothing at all
            when next relied upon. Your sabotage is discovered only by an
            intentional Awareness check which beats your passive
            Alchemy.</p></li><li><p><strong>Create.</strong> Given time and
            reasonable access to ingredients, you may prepare any minor
            alchemical work you are familiar with: inks and dyes, a glue that
            holds under water, a perfume that lingers a full day, fireworks in
            three colors, acid enough to etch a name in steel. Explicitly
            defined crafting recipes must still be rolled, but you can
            successfully prepare any such work outside of this system without
            requiring a dice roll.</p></li></ul><p>You may attempt other uses
            similar to those above, the effectiveness of which is decided by the
            Gamemaster.</p>
