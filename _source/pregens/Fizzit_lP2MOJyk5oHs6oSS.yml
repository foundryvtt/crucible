          description: >-
            <p>You use your equipped Talisman to attempt to regain some
            <strong>Focus</strong>. You perform a <strong>Harmless</strong>
            <strong>Strike</strong> against your own <strong>Rallying</strong>
            threshold.</p><p>On a success you recover <strong>+1 Focus</strong>
            if using a one-handed Talisman and <strong>+2 Focus</strong> if
