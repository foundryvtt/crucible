  - name: 'Rune: Soul'
    type: talent
    img: icons/magic/light/projectile-halo-teal.webp
    system:
      description: >-
        <p>An orderly force of creation and spiritual essence. The Soul rune
        governs the fundamental procession of souls through life and death and
        relates to matters of sapience, personality, and mental
        health.</p><p>The Soul rune scales using <strong>Presence</strong> and
        provides <strong>Restoration</strong> of <strong>Morale</strong>. In
        special circumstances it may be used to inflict <strong>Psychic</strong>
        damage opposed by <strong>Willpower</strong>. It is opposed by the
        chaotic rune of <strong>Oblivion</strong>.</p>
      actions:
        - id: evoke
          img: icons/magic/light/projectile-halo-teal.webp
          cost:
            action: 3
            focus: 1
            heroism: 0
            weapon: false
            hands: 1
          range:
            minimum: null
            maximum: 1
            weapon: false
          target:
            type: self
            number: 1
            scope: 4
            self: false
          effects: []
          tags:
            - spell
            - harmless
          name: Evoke
          condition: ''
          description: >-
            <p>Your command of the Rune of Soul allows you to facilitate basic
            forms of spiritual influence, producing one of the following
            effects:</p><ul><li><p>Enable yourself or another willing person to
            revisit a core memory of a moment from their past up to one minute
            in duration as if it happened recently.</p></li><li><p>Identify a
            negative spiritual condition that is affecting a person such as
            @Condition[broken], @Condition[frightened], @Condition[confused], or
            @Condition[insane].</p></li><li><p>Create a momentary spiritual
            connection with another willing creature that allows them to
            recognize an idea which can be expressed as a single
            word.</p></li></ul><p>Uses of Evoke may only affect yourself or
            another creature which you can physically touch. You may attempt
            other uses similar those above, the effectiveness of which is
            decided by the Gamemaster.</p>
          summon: null
      spellcraft: soul
      nodes:
