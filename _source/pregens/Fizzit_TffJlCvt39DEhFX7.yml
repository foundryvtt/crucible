  - name: 'Gesture: Create'
    type: talent
    img: icons/magic/nature/plant-sproud-hands-dirt-green.webp
    system:
      description: >-
        <p>You coalesce arcane power into tangible form, manifesting a
        <strong>Sprite</strong> which appears within <strong>10 feet</strong>
        and joins <strong>Combat</strong> at <strong>Initiative 1</strong>. Your
        <strong>Sprite</strong> is a <strong>Minion</strong> of half your own
        <strong>Level</strong>.</p><p>The <strong>Create</strong> gesture scales
        with @Rule[ability.wisdom] and the <strong>Sprite</strong> survives for
        <strong>6 Rounds</strong>. You may only have one active
        <strong>Sprite</strong>; casting another spell using the
        <strong>Create</strong> gesture replaces your previous
        <strong>Sprite</strong>. This gesture requires <strong>2 Hands</strong>
        to cast and has a base cost of <strong>4 Action</strong> and <strong>1
        Focus</strong>.</p><h3 class="divider">Playtest Notes</h3><p>Not all
        Runes have a Sprite actor defined yet. Runes that do not yet have a
