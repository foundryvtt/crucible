      description: >-
        <p>The orderly force of elemental earth, responsible for physical
        matter. The Earth rune governs minerals, metals, soils, and other
        physical compounds.</p><p>The Earth rune scales using
        <strong>Wisdom</strong>, targets <strong>Reflex</strong>, and deals
        <strong>Acid</strong> damage to <strong>Health</strong>. It is opposed
        by the chaotic rune of <strong>Storm</strong>.</p>
      actions:
        - id: mould
          name: Mould
          img: icons/magic/earth/projectile-boulder-debris.webp
          condition: ''
          description: >-
            <p>Your command of the Rune of Earth allows you to manipulate raw
            forces of rock, mineral, and soil in basic ways, producing one of
            the following effects:</p><ul><li><p>Quickly shape up to one cubic
            foot of available material into a simple geometric form like a
            cuboid, ellipsoid, or polyhedron.</p></li><li><p>Precisely copy the
            physical shape of a held object that is smaller than a 6-inch cube,
            reproducing it from available clay, stone, or metal. The replica
            retains no useful properties except for its physical
            form.</p></li><li><p>Separate and collect earthen particles from the
            surface of an object, creature, or liquid that you touch, rendering
            the subject completely cleaned or purified in
            moments.</p></li></ul><p>Mould may only affect a creature or object
            you can physically touch. You may attempt other uses similar those
            above, the effectiveness of which is decided by the Gamemaster.</p>
