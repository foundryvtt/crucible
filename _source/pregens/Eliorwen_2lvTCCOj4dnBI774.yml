  - name: Forensic Reconstruction
    type: talent
    img: icons/magic/perception/orb-eye-scrying.webp
    system:
      nodes:
        - wis1a
      description: >-
        <p>You treat a room as a body of evidence. Dust disturbed and dust
        undisturbed, the angle of a dropped object, a scuff running the wrong
        way, the one thing that ought to be here and is not: you assemble such
        facts into an account of what happened.</p>
      actions:
        - id: reconstruct
          name: Reconstruct
          img: icons/magic/perception/orb-eye-scrying.webp
          condition: ''
          description: >-
            <p>Name aloud a theory of what happened in this place. If the
            Gamemaster judges that the place could bear your theory out or
            contradict it, perform an <strong>Awareness</strong> check against
            <strong>DC 14</strong>.</p><ul><li><p><strong>+2 Boons</strong> if
            your theory follows from evidence you have already
            gathered.</p></li><li><p><strong>+2 Banes</strong> if it is
            conjecture, or if the place has been cleaned, trampled, or
            reoccupied since.</p></li></ul><p>Upon a <strong>Success</strong>
            you deduce one true thing bearing upon your theory, which may
            support or refute it. Upon a <strong>Critical Success</strong> you
            deduce a second, which the Gamemaster may draw from what your theory
            did not think to ask.</p><p>A theory may only be investigated once.
            A failed investigation does not mean the theory is incorrect, only
            that no corroborating evidence was found.</p><p>The place answers in
            physical fact alone: it never names a culprit, a motive, or a word
            that was spoken.</p>
