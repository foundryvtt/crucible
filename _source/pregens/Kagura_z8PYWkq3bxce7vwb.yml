  - name: 'Rune: Life'
    type: talent
    img: icons/magic/life/heart-shadow-red.webp
    system:
      description: >-
        <p>A chaotic force of creation, responsible for living matter. The Life
        rune governs health and matters relating to biological growth.</p><p>The
        Life rune scales using <strong>Wisdom</strong> and provides
        <strong>Restoration</strong> of <strong>Health</strong>. In special
        circumstances it may be used to inflict <strong>Poison</strong> damage
        opposed by <strong>Fortitude</strong>. It is opposed by the orderly rune
        of <strong>Death</strong>.</p>
      actions:
        - id: bloom
          name: Bloom
          img: icons/magic/life/heart-shadow-red.webp
          condition: ''
          description: >-
            <p>Your command of the Rune of Life allows you to stimulate
            biological growth and nourish physical health, producing one of the
            following effects:</p><ul><li><p>Cultivate 1 cubic foot of existing
            plants or fungus to rapidly grow to a healthy, blossoming, or
            harvestable state.</p></li><li><p>Identify a negative physical
            condition that is affecting a creature such as @Condition[diseased],
            @Condition[poisoned], @Condition[bleeding], or
            @Condition[weakened].</p></li><li><p>Verify whether a portion of
            food or drink is free of contamination from bacteria, parasites, or
            poison.</p></li></ul><p>Bloom may only affect a creature or object
            you can physically touch. You may attempt other uses similar those
            above, the effectiveness of which is decided by the Gamemaster.</p>
          cost:
            action: 3
            focus: 1
            heroism: 0
            weapon: false
            hands: 1
          range:
            minimum: null
            maximum: 1
            weapon: false
          target:
