      description: >-
        <p>You shape the essence of a <strong>Rune</strong> into a sweeping or
        splintered arc to strike multiple targets in close proximity.</p><p>The
        <strong>Fan</strong> gesture scales using <strong>Intellect</strong> and
        targets a 120 degree arc with a <strong>6 foot</strong> radius. It deals
