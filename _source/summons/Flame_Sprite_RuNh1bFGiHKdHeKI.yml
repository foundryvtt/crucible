  - name: 'Rune: Flame'
    type: talent
    img: icons/magic/fire/barrier-wall-flame-ring-yellow.webp
    system:
      description: >-
        <p>The chaotic force of elemental, thermal energy. The
        <strong>Flame</strong> rune governs fire and heat.</p><p>The
        <strong>Flame</strong> rune scales using <strong>Intellect</strong>,
        targets <strong>Reflex</strong>, and deals <strong>Fire</strong> damage
        to <strong>Health</strong>. It is opposed by the orderly rune of
        <strong>Frost</strong>.</p>
      actions:
        - id: enkindle
          name: Enkindle
          img: icons/magic/fire/barrier-wall-flame-ring-yellow.webp
          condition: ''
          description: >-
            <p>Your command of the Rune of Flame allows you to manipulate fire
            and thermal energy in creative ways, producing one of the following
            effects:</p><ul><li><p>Manifest a burst of elemental flame in one
            inch sphere which can ignite a candle, torch, or other flammable
            materials.</p></li><li><p>Imbue your body with momentary thermal
            shielding which provides you with immunity to fire damage on an
            immediately subsequent action that costs <strong>1 Action</strong>
            or less.</p></li><li><p>Control the movement of flames within a
            small area, causing them to flicker, dance, or shift in an animated
            performance of light and shadow.</p></li></ul><p>Enkindle may only
            affect a creature or object you can physically touch. You may
            attempt other uses similar those above, the effectiveness of which
            is decided by the Gamemaster.</p>
