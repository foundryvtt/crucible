items:
  - name: Glider
    type: talent
    img: icons/creatures/birds/raptor-hawk-flying.webp
    system:
      nodes: []
      description: >-
        <p>The @ref[actor.name]{creature} controls its descent while falling.
        Unless it is @Condition[incapacitated] or @Condition[restrained], a fall
        becomes a <strong>Glide</strong>: a downward <strong>Fly</strong>
        movement instead of an impact, suffering no falling damage.</p><p>While
        gliding the creature's @Rule[movement.stride] is doubled and it is
        granted a @Rule[movement.freeMovement]{free move}, so it can always
        glide at least a short distance. Its glide must descend, and wherever
        the movement ends is where it comes to rest; if it ends the glide still
        aloft it gains the @Condition[flying] condition.</p>
      actions:
        - id: fallGlide
          name: Glide
          img: icons/svg/wing.svg
          condition: ''
          description: >-
            <p>The @ref[actor.name]{creature} glides rather than falls, flying
            downward under control. The movement must descend and suffers no
            falling damage. If the creature ends its glide while still aloft it
            gains the @Condition[flying] condition.</p>
