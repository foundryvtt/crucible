    <p>You may perform alchemical crafting without a facility, though attempts
    made without one are <strong>Difficult</strong>. You may include one
    ingredient in a recipe which is a single quality tier lower than that recipe
    calls for without penalty.</p><h3 class="divider">Playtest Notes</h3><p>The
