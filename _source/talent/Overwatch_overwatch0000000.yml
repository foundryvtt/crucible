    <p>You hold the battlefield in your sights, ready to punish any foe who acts
    within your line of fire. Any enemy who acts against another creature
    risks your shot, and a spellcaster who weaves magic before you risks the
    unraveling of their spellcraft as well.</p>
  actions:
