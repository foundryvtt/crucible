        <strong>Strike</strong> against that enemy. If the triggering action is
        a spell, a @Rule[dice.criticalSuccess]{Critical Hit} interrupts it and
        the magic is lost. A self-targeted action that is not a
        spell, such as @Action[default move] or @Action[default defend], does
        not trigger this <strong>Reaction</strong>, which may be used only once
        per <strong>Round</strong>.</p>
