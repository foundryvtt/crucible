system:
  description: >-
    <p>Years at the anvil teach a smith to read iron the way a scholar reads a
    page. You know where a fitting was welded, where it has been mended, and
    where it will give.</p>
  actions:
    - id: coldwork
      name: Coldwork
      img: icons/skills/trades/smithing-tongs-metal-red.webp
      condition: ''
      description: >-
        <p>You know metal by feel: where it was worked, where it has been
        mended, and where a single blow will part it. Working with what you
        carry, you may produce one of the following
        effects:</p><ul><li><p><strong>Part</strong> a non-enchanted iron or
        steel fitting no thicker than your thumb, such as a chain link, shackle,
        manacle, padlock, or hasp, or a weapon or armor in your possession which
        is not equipped. You strike where it was welded, pinned, or tempered.
        The item is destroyed and cannot be
        repaired.</p></li><li><p><strong>Foul</strong> the workings of a
        non-magical mechanism which weighs less than your carrying capacity and
        whose moving parts you can reach, such as a lock, a latch, a trap, or
        the hinge of a door. It seizes and cannot be operated by anyone,
        yourself included, until repaired with ten minutes of work and a Smith's
        Toolkit.</p></li><li><p><strong>Read</strong> a metal object you can
        clearly see within <strong>30 feet</strong> to learn its quality tier
        and whether it is <strong>Broken</strong>. You learn nothing of its
        enchantment, its affixes, or its history.</p></li></ul><p>Part and Foul
        may only affect an object you can physically touch. You may attempt
        other uses similar to those above, the effectiveness of which is decided
        by the Gamemaster.</p>
