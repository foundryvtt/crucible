name: Coldwork
type: talent
img: icons/skills/trades/smithing-tongs-metal-red.webp
system:
  description: >-
    <p>Years at the anvil teach a smith to read iron the way a scholar reads a
    page. You know where a fitting was welded, where it has been mended, and
    where it will give.</p>
  actions:
    - id: coldwork
      name: Coldwork
      img: icons/skills/trades/smithing-tongs-metal-red.webp
      condition: ''
      description: >-
        <p>You know metal by feel: where it was worked, where it has been
        mended, and where a single blow will part it. Working with what you
        carry, you may produce one of the following
        effects:</p><ul><li><p><strong>Read.</strong> You study a metal object
        which you can clearly see within <strong>30 feet</strong>, learning its
        <strong>Quality</strong> tier and whether it is <strong>Broken</strong>.
        You learn nothing of its enchantment, its affixes, or its
        history.</p></li><li><p><strong>Destroy.</strong> You instantaneously
        sunder a non-magical iron or steel fitting no thicker than your thumb
        which you can physically touch, such as a chain link, a padlock, or a
        manacle, or a non-magical weapon, shield, or suit of armor in your
        possession which is not equipped, striking where it was welded, pinned,
        or tempered. Alternatively you may spend 10 minutes to sabotage such a
        work of iron or steel so that it fails at a future moment under
        conditions which you specify. Your sabotage is discovered only by an
        intentional Awareness check which beats your passive
        Smithing.</p></li><li><p><strong>Create.</strong> You spend 10 minutes
        and materials at hand to forge a working copy of a non-magical key which
        you hold, a copy of a seal or signet which you can handle, or
        serviceable field iron such as caltrops, climbing spikes, or a grapple
        hook.</p></li></ul><p>You may attempt other uses similar to those above,
        the effectiveness of which is decided by the Gamemaster.</p>
