system:
  description: >-
    <p>You move quietly and cautiously to break one opponent's awareness of your
    position, slipping out of their notice while they remain occupied
    elsewhere.</p><h3 class="divider">Playtest Notes</h3><p>The Stealth check
    resolves and marks you concealed for its duration. Crucible does not yet
    record which creatures have lost track of you, so the Gamemaster adjudicates
    that: your target is treated as @Condition[unaware] of you for actions which
    check that condition, though the status itself is not applied and token
    visibility does not change. A forthcoming stealth effect will record
    detection for each creature individually.</p>
  actions:
    - id: sneak
      name: Sneak
      img: icons/magic/perception/shadow-stealth-eyes-purple.webp
      condition: ''
      description: >-
        <p>Target one enemy which you can see at a distance of at least 20 feet.
        You make a Stealth check against their Awareness. Upon a success that
        creature loses track of you until the start of your next turn, or until
        you perform an action targeting them which is not
        <strong>Undetectable</strong>. Upon a Critical Success the effect
        instead persists for two rounds.</p>
