system:
  description: >-
    <p>You can take a finished glyph apart stroke by stroke and see exactly how
    it was made. What you learn stays with you. The glyph does not.</p>

    <p>You may spend an hour to unravel a glyph in your possession, destroying
    it. You thereafter know the schematic which produces that glyph and may
    craft it without holding a physical copy, as though you had already crafted
    it successfully.</p><h3 class="divider">Playtest Notes</h3><p>The crafting
    system is in early development and schematic knowledge is not yet tracked.
    This talent describes how Glyphweaving will behave once it is.</p>
