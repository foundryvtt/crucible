name: Warden
type: talent
img: icons/magic/nature/barrier-shield-wood-vines.webp
system:
  description: >-
    <p>You are a keeper of the old ways, a battle-druid who calls upon ancestral
    spirits of nature to shelter those under your protection.</p><p>You use
    @Action[Compendium.crucible.talent.Item.warden0000000000 ancestralGrove] to
    call forth an area of natural protection originating from the spiritual
    projection of an <strong>Ancestral Guardian</strong>.</p><h3
    class="divider">Playtesting</h3><p>The passive <strong>Resistance</strong>
    aura radiated by the <strong>Ancestral Guardian</strong> is not yet fully
    automated, pending further Aura and Region improvements.</p>
  actions:
    - id: ancestralGrove
      name: Ancestral Grove
      img: icons/magic/nature/tree-spirit-green.webp
      condition: ''
      description: >-
        <p>You call forth an
        @UUID[Compendium.crucible.summons.Actor.ancestralGuard00]{Ancestral
        Guardian} which manifests at a point you can see within <strong>30
        feet</strong>. The <strong>Guardian</strong> is an incorporeal spirit
        that cannot be harmed or moved. Creatures can pass through its space,
        but it counts as three creatures for the purposes of determining whether
        an enemy is @Condition[flanked].</p><p>The <strong>Guardian</strong>
        emanates an aura with a <strong>20 foot radius</strong> that increases
        the <strong>Resistance</strong> of allies to all damage types by
        +2.</p><p>So long as the <strong>Guardian</strong> endures, your weapon
        attacks against enemies within this aura cause a transfer of life-force
        from your enemies to your allies. Your target suffers additional
        <strong>Poison</strong> damage equal to half your
        <strong>Wisdom</strong>, which is transferred as <strong>Health</strong>
        restoration to yourself or an ally within the grove who currently has
        the lowest <strong>Health</strong>.</p><p>The <strong>Guardian</strong>
        remains until <strong>Combat</strong> ends, or until the
        <strong>Warden</strong> uses this action again.</p><p></p>
