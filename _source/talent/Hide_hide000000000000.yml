system:
  description: >-
    <p>You use cover, shadow, and stillness to drop out of sight entirely, to
    avoid detection or to lay in ambush.</p><h3 class="divider">Playtest
    Notes</h3><p>The Stealth check resolves, marks you concealed, and that
    concealment ends on its own once you act without the <strong>Subtle</strong>
    tag. Your Stealth result is recorded, so anyone who later @Action[default
    search]es for you tests their Awareness against it. Crucible does not yet
    record which creatures individually have lost track of you, so beating one
    observer conceals you from all of them and the Gamemaster adjudicates the
    difference. A forthcoming stealth effect will track detection per
    creature.</p>
  actions:
    - id: hide
      name: Hide
      img: icons/magic/nature/stealth-hide-eyes-green.webp
      condition: ''
      description: >-
        <p>You cannot Hide while engaged. You make a single Stealth check
        against the Awareness of the most perceptive enemy within 30 feet,
        taking <strong>+1 Bane</strong> for each further enemy who might notice
        you. With no enemy near enough to notice you no check is required. Upon
        a success you are concealed until you perform an action which is not
        <strong>Subtle</strong>.</p>
