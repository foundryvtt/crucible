system:
  description: >-
    <p>You use cover, shadow, and stillness to drop out of sight entirely rather
    than evading a single pair of eyes.</p><h3 class="divider">Playtest
    Notes</h3><p>The Stealth check resolves, marks you concealed, and that
    concealment ends on its own once you act without the
    <strong>Subtle</strong> tag. Crucible does not yet record which
    creatures have lost track of you, so the Gamemaster adjudicates that, and a
    creature arriving after you hide is not resolved against you at all. A
    forthcoming stealth effect will record detection for each creature and let a
    latecomer test its own Awareness against the result you rolled.</p>
  actions:
    - id: hide
      name: Hide
      img: icons/magic/nature/stealth-hide-eyes-green.webp
      condition: ''
      description: >-
        <p>You cannot Hide while engaged. You make a single Stealth check
        against the Awareness of the most perceptive enemy within 30 feet,
        taking <strong>+1 Bane</strong> for each further enemy who might notice
        you. With no enemy near enough to notice you no check is required. Upon
        a success you are concealed until you perform an action which is not
        <strong>Subtle</strong>.</p>
