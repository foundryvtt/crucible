name: 'Gesture: Aura'
type: talent
img: icons/magic/light/explosion-beam-impact-silhouette.webp
system:
  nodes:
    - pre4d
  description: >-
    <p>You concentrate the arcane power of a Rune to create a maintained field
    of energy that washes over allies or enemies near to you.</p><p>The Aura
    gesture scales with @Rule[ability.presence] and produces an emanation with
    20 feet radius centered on the spellcaster. The center of this Aura moves
    with the spellcaster. This gesture requires 2 Hands to cast, has a base cost
    of 5 Action and 1 Focus, and must be @Rule[action.maintained] costing an
    additional 1 Focus every subsequent round.</p><p>When a creature starts its
    <strong>Turn</strong> or enters the area of your aura, they are targeted by
    a <strong>Spell Attack</strong> which causes either damage or healing
    depending on which <strong>Rune</strong> was used for this spell. This
    attack deals <strong>6 Base Damage</strong>, and its defense type and damage
    type are also determined by its Rune.</p><h3 class="divider">Playtest
    Notes</h3><p>This talent is currently placed at a <strong>Tier 4</strong>
    node. It will eventually only be attainable at a higher level (probably
    Level 6 required). It is currently available "early" for testing.</p>
