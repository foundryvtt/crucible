  description: >-
    <p>You concentrate the arcane power of a <strong>Rune</strong> to create a
    maintained field of energy that washes over allies and enemies near to
    you.</p><p>The <strong>Aura</strong> gesture scales with
    <strong>Presence</strong> and produces an emanation with a <strong>20
    foot</strong> radius centered on the spellcaster. The center of this
    <strong>Aura</strong> moves with the spellcaster.</p><p>Depending on the
    <strong>Rune</strong> used, the <strong>Aura</strong> deals damage or
    provides healing to any creature which begins its turn inside the
    <strong>Aura</strong>. This gesture requires <strong>2 Hands</strong> to
    cast, has a base cost of <strong>5 Action</strong> and <strong>1
    Focus</strong>, and must be @Rule[action.maintained], costing an additional
    <strong>1 Focus</strong> every subsequent round.</p>
