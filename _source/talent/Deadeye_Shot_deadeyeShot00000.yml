      description: >-
        <p>With a ranged weapon equipped, you take aim at an enemy you can see,
        at any distance. You gain <strong>Deadeye Aim</strong>, which you must
        maintain at the start of your next turn, and the enemy gains <strong>Deadeye
        Target</strong>, which warns that you are aiming at it. Both end at
        the end of your next turn, or when you release a <strong>Deadeye
        Shot</strong>, which you must do before you move on that turn.</p>
