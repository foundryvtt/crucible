    <p>You have trained your animal companion to aid you in combat. Your
    companion may participate in encounters as an allied combatant, and you have
    developed techniques for teaming up on enemies.</p><p>Your companion is a
    <strong>Minion</strong>-threat Adversary, its level equal to half of yours,
    rounding up. Your companion is marked <strong>Important</strong>, meaning
    that they use the reserve resources of @Rule[resource.wounds] and
    @Rule[resource.madness].</p>
