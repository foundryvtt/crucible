name: Assassin
type: talent
img: icons/magic/death/skull-humanoid-white-blue.webp
system:
  description: >-
    <p>You specialize in bringing death to the unwary. Any @Rule[action.strike]
    or <strong>Spell</strong> attack against an @Condition[unaware] target
    multiplies its damage <strong>Overflow</strong> by x3, whether or not the
    attack is already @Rule[action.deadly]. If that target is the creature you
    have marked for death, its <strong>Armor</strong> is also halved against the
    attack.</p><p>An @Condition[unaware] creature hit by your attack may not
    alert its allies until its own turn in <strong>Combat</strong>.</p>
  actions:
    - id: markForDeath
      name: Mark For Death
      img: icons/magic/death/skull-humanoid-white-blue.webp
      condition: You are unobserved.
      description: >-
        <p>You spend <strong>1 minute</strong> studying a creature. Perform a
        <strong>Knowledge Test</strong> about your target. If successful, you
        learn all damage types against which the target is
        <strong>Vulnerable</strong>. Your minimum <strong>Initiative</strong>
        during the first round of <strong>Combat</strong> becomes one greater
        than the <strong>Initiative</strong> of your marked target. The mark
        lasts for <strong>24 hours</strong>.</p><h3 class="divider">Playtest
        Notes</h3><p>The Knowledge Test and the Initiative adjustment are not
        yet automated.</p>
