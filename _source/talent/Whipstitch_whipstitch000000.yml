name: Whipstitch
type: talent
img: icons/commodities/cloth/thread-spindle-white.webp
system:
  description: >-
    <p>A tailor's eye misses nothing about a garment: the loom it came from, the
    hand that altered it, and the body it was cut for. A tailor's hand leaves
    nothing behind.</p>
  actions:
    - id: whipstitch
      name: Whipstitch
      img: icons/commodities/cloth/thread-spindle-white.webp
      condition: You have a Tailor's Toolkit equipped.
      description: >-
        <p>Cloth tells you where it was woven, who wore it, and where it will
        give. With a Tailor's Toolkit equipped, you can produce any one of the
        following effects:</p><ul><li><p><strong>Read.</strong> You study the
        garments and worn gear of a creature which you can clearly see within
        <strong>30 feet</strong>, learning the <strong>Quality</strong> tier of
        what it wears, whether those garments were tailored for that wearer or
        altered from another's, and what size of garment or armor would fit
        it.</p></li><li><p><strong>Destroy.</strong> You instantaneously sever a
        non-magical garment, strap, or binding in your possession so that it
        comes apart cleanly in your hands without a blade. Alternatively you may
        spend 10 minutes to sabotage a non-magical work of leather or fabric.
        You name the condition under which it fails; when that condition is met,
        the Gamemaster decides the consequences. Your sabotage is discovered
        only by an intentional Awareness check which beats your passive
        Tailoring.</p></li><li><p><strong>Create.</strong> You spend 10 minutes
        to rework a garment which you can handle into the dress of a specific
        people, household, or order whose attire you have seen firsthand, which
        holds until the garment is closely handled or cleaned. While you work
        you may sew into it an object weighing a pound or less, discovered only
        by an intentional Awareness check which beats your passive
        Tailoring.</p></li></ul><p>You may attempt other uses similar to those
        above, the effectiveness of which is decided by the Gamemaster.</p>
