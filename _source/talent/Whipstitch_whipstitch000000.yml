name: Whipstitch
type: talent
img: icons/commodities/cloth/thread-spindle-white.webp
system:
  description: >-
    <p>A tailor's eye misses nothing about a garment: the loom it came from, the
    hand that altered it, and the body it was cut for. A tailor's hand leaves
    nothing behind.</p>
  actions:
    - id: whipstitch
      name: Whipstitch
      img: icons/commodities/cloth/thread-spindle-white.webp
      condition: ''
      description: >-
        <p>Cloth tells you where it was woven, who wore it, and where it will
        give. Working with what you carry, you may produce one of the following
        effects:</p><ul><li><p><strong>Read</strong> the garments and worn gear
        of a creature you can clearly see within <strong>30 feet</strong>. You
        learn the quality tier of what it wears, whether those garments were
        tailored for that wearer or altered from another's, and what size of
        garment or armor would fit that
        creature.</p></li><li><p><strong>Seamless.</strong> Conceal an object
        weighing <strong>1 pound or less</strong>, such as a letter, a vial, or
        a stiletto, within a garment, pack, or bedroll you can handle. It is
        found only by a search which beats your passive Tailoring. Anyone who
        knows where it lies may retrieve it, though only your hand can reopen
        and close the seam without leaving a
        sign.</p></li><li><p><strong>Rework</strong> a garment you can handle
        into the dress of a specific people, household, or order whose attire
        you have seen firsthand. The work takes ten minutes and holds until the
        garment is closely handled or cleaned.</p></li></ul><p>You may attempt
        other uses similar to those above, the effectiveness of which is decided
        by the Gamemaster.</p>
