name: Infiltrator
type: talent
_id: infiltrator00000
img: icons/magic/perception/shadow-stealth-eyes-purple.webp
system:
  description: >-
    <p>You have mastered traditional stealth, using shadow and cover to slip the
    notice of a watchful group rather than a single distracted sentry. When you
    use @Action[Compendium.crucible.talent.Item.sneak00000000000 sneak] you may
    target up to three creatures simultaneously, resolving a separate Stealth
    check against the Awareness of each.</p><h3 class="divider">Playtest
    Notes</h3><p>All three checks resolve, but Crucible does not yet record
    which creatures have lost track of you, so beating one target conceals you
    no differently from beating all three and the Gamemaster adjudicates the
    difference. A forthcoming stealth effect will record detection for each
    creature and treat this talent as raising how many you may evade at
    once.</p>
