name: Strategic Repositioning
type: talent
img: icons/sundries/gaming/chess-knight-white.webp
system:
  description: >-
    <p>You are always thinking ahead about where to position yourself should
    danger loom. Before <strong>Turn 1</strong> of a <strong>Combat</strong>
    encounter, provided that you are not @Condition[unaware], you may
    immediately move up to <strong>4 feet</strong> in any permitted
    direction.</p><p>If multiple combatants have this feature, repositioning
    occurs in reverse order of <strong>Initiative</strong>.</p><h3
    class="divider">Playtest Notes</h3><p>This talent is not yet automated.</p>
