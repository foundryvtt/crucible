        <p>You move up to your @Rule[movement.stride] with forceful momentum,
        passing through the space of one other creature along your path. An ally
        lets you pass freely.</p><p>An enemy contests your passage: make an
        @Rule[skill.athletics] @Rule[action.skill] attack against its
