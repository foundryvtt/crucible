system:
  description: >-
    <p>Your presence as a battlefield leader hardens the resolve of your allies,
    enabling them to sustain their morale in even the most harrowing of
    circumstances.</p>
  actions:
    - id: rallyingCry
      description: >-
        <p>You produce a courageous bellow that inspires allies within 12 feet
        of you to remain stalwart in the face of peril. You make an
        <strong>Intimidation</strong> check against the
        <strong>Rallying</strong> threshold of each ally. Upon a success, they
        become @Condition[resolute] for 3 Rounds. Upon a Critical Success, they
        also recover an amount of <strong>Morale</strong> equal to your
        <strong>Presence</strong> score.</p>
