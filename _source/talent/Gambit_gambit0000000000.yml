name: Gambit
type: talent
_id: gambit0000000000
img: icons/sundries/gaming/dice-pair-white-green.webp
system:
  description: >-
    <p>You fight by the odds and every exchange is a wager. You read your
    opponent's intent, make risky bets to goad them into overcommitting, then
    stake everything on a game-changing payout. You trust your gut, wits, and
    some arcane chicanery to tilt the odds in your favor, gaining the following
    benefits:</p><ul><li><p><em>The Tell.</em> You see a blow before it is
    thrown. Your @Rule[defense.dodge] defense is calculated using your
    @Rule[ability.intellect] instead of @Rule[ability.dexterity], if your
    @Rule[ability.intellect] is higher.</p></li><li><p><em>Loaded Dice.</em>
    Fortune bends to those who help it along. Once per round, the first time you
    roll a 1 on any die, that die is rerolled and you keep the new
    result.</p></li><li><p><em>Ante Up.</em> When you make a @Action[default
    strike], you can choose to wager additional @Rule[dice.bane]{Banes} against
    yourself. If the <strong>Strike</strong> hits an enemy, you gain
    <strong>Gambit</strong> charges equal to the number of
    @Rule[dice.bane]{Banes} you wagered. These charges accumulate until the end
    of <strong>Combat</strong> or until spent.</p></li></ul>
  actions:
    - id: gambitAllIn
      name: All-In
      img: icons/sundries/gaming/dice-pair-white-green.webp
      condition: ''
      description: >-
        <p>Every gamble you have made comes due, and you collect all at once.
        The next attack or check you make this turn rolls the maximum possible
        result on every die in its pool. If that action makes more than one
        roll, only the first is maximized. You can activate this action by
        spending either <strong>6 Gambit</strong> charges or @Rule[resource.heroism]{1
        Heroism}.</p>
