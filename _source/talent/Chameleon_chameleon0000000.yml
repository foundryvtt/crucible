system:
  description: >-
    <p>You blend into your surroundings so completely that motion no longer
    betrays you. While you are concealed by
    @Action[Compendium.crucible.talent.Item.hide000000000000 hide] your Move
    action is <strong>Undetectable</strong>, allowing you to reposition without
    revealing yourself.</p><h3 class="divider">Playtest Notes</h3><p>The Move
    action gains the tag automatically while you are concealed, so repositioning
    no longer ends your concealment. Crucible does not yet record which
    creatures have lost track of you, so whether moving into the open reveals
    you remains the Gamemaster's call. A forthcoming stealth effect will record
    detection for each creature individually.</p>
