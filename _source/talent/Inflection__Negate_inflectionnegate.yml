name: 'Inflection: Negate'
type: talent
img: icons/magic/unholy/orb-beam-pink.webp
system:
  description: >-
    <p>Invert the effect of a spell. A @Spell[life.touch] spell which normally
    heals a target becomes a @Spell[life.touch.negate] spell, dealing
    <strong>Poison</strong> damage instead. A @Spell[death.ward] spell which
    normally increases resistance to <strong>Corruption</strong> damage becomes
    a @Spell[death.ward.negate] spell, inflicting vulnerability to
    <strong>Corruption</strong> damage upon an enemy instead.</p><section
    class="construction"><p>The effects of the Negate inflection are not yet
    automated for Playtest 1. This inflection is included as an example of the
    intended direction for the Spellcraft system.</p></section>
