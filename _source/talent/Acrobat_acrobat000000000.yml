name: Acrobat
type: talent
img: icons/magic/control/debuff-energy-hold-levitate-blue-yellow.webp
system:
  description: >-
    <p>You fight with the fluid grace of an acrobat, treating your weapon as a
    vaulting pole as readily as an armament. While wielding a <strong>Balanced
    2H</strong> weapon, your movement does not provoke a @Action[default
    reactiveStrike], and jumping costs you no more movement than walking. Your
    whirling weapon also bats aside incoming missiles, imposing
    @Rule[dice.bane]{+2 Banes} on ranged weapon attacks made against you.</p>
  actions:
    - id: vaultingSweep
      name: Vaulting Sweep
      img: icons/magic/control/debuff-energy-hold-levitate-blue-yellow.webp
      condition: ''
      description: >-
        <p>You vault into the air and crash down amid your foes, your weapon
        whirling in a dazzling arc. Choose a point at least half your
        @Rule[movement.stride] away but no farther than your full
        @Rule[movement.stride] and leap to it, then make a @Action[default
        strike] against every creature within your weapon's reach of where you
        land, friend or foe.</p>
