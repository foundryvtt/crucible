name: Arcane Archer
type: talent
img: icons/skills/ranged/arrows-flying-salvo-blue-light.webp
system:
  description: >-
    <p>Your skill with archery can shape your spellcraft, partially substituting
    for the somatic gestures of traditional spellcasting.</p><p>While using a
    <strong>Projectile</strong> weapon as your mainhand weapon, your
    @Rule[action.strike]{Strikes} scale using @Rule[ability.wisdom] instead of
    @Rule[ability.strength] in addition to
    @Rule[ability.dexterity].</p><p>Spells you cast using
    @UUID[Compendium.crucible.talent.Item.gesturearrow0000]{Gesture: Arrow}
    ignore the free-hand requirement, use your weapon range, and the gesture
    scales using @Rule[ability.wisdom] instead of
    @Rule[ability.intellect].</p><p>Immediately after performing a
    <strong>Strike</strong> with a projectile weapon, you may cast a spell with
    its @Rule[resource.action] cost reduced by 1.</p>
