system:
  description: >-
    <p>A stout, waddling forager of the deep woods, the porcupine is armored in
    a mantle of barbed quills that bristle at the first hint of danger. When
    threatened, it turns its back, rattles its quills like a dry reed fence, and
    waits for its foe to make the mistake.</p>
