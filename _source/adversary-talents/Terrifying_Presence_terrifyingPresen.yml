      description: >-
        <p>The @ref[actor.name]{creature} makes a formidable display of menace
        which fills those nearby with dread. For the next <strong>6
        Rounds</strong>, any enemy within <strong>20 feet</strong> of the
        @ref[actor.name]{creature}, or which later enters that area, suffers an
        attack to its @Rule[defense.willpower]. On a @Rule[dice.success], the
        attack deals @Rule[damageType.psychic] damage to its
        @Rule[resource.morale] and causes it to become @Condition[frightened]
        until the start of its next turn.</p>
