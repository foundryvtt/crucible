      img: icons/magic/control/fear-fright-monster-purple-blue.webp
      description: >-
        <p>The @ref[actor.name]{creature} lets loose an aura of fear. Any
        enemies within <strong>20 feet</strong> of the
        @ref[actor.name]{creature} immediately suffer an attack to their
        @Rule[defense.willpower], with a @Rule[dice.success] dealing
        @Rule[damageType.psychic] damage to their @Rule[resource.morale] and
        causing the @Condition[frightened] until the start of their next turn.
        Thereafter, whenever an enemy enters or starts its turn within
        <strong>20 feet</strong> of the @ref[actor.name]{creature}, it becomes
        exposed to the dreadful presence, suffering a @Rule[action.harmless]
        attack to its @Rule[defense.willpower] and becoming
        @Condition[frightened] until the start of its next turn upon
        @Rule[dice.success].</p>
