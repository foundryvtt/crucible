  description: >-
    <p>The @ref[actor.name]{creature} can draw a creature whose
    @Rule[movement.size] is at least 2 less than its own into its digestive sacs
    to be consumed by corrosive acids. Up to three creatures may be engulfed at
    a time.</p><p>If the @ref[actor.name]{creature} gains @Condition[burning], 
    @Condition[stunned], @Condition[incapacitated], or @Condition[weakened], it
    regurgitates every engulfed creature.</p>
  actions:
    - id: digestiveSacs
      name: Digestive Sacs
      img: icons/magic/nature/plant-maneater-purple.webp
      description: >-
        <p>You draw a target enemy into one of your digestive sacs. The engulfed
        target is @Condition[restrained] and @Condition[corroding] until
        released, as digestive acids attempt to consume them.</p><p>If you gain
        the condition @Condition[burning], @Condition[stunned],
        @Condition[incapacitated], or @Condition[weakened], you regurgitate
        every engulfed creature.</p>
