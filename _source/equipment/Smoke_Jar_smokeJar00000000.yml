    public: >-
      <p>A heavy clay jar packed with smoldering reagents and sealed with wax.
      When exposed to air, the contents erupt into rapid burning embers and
      thick grey smoke that blots out sight across a wide area before the haze
      drifts apart on its own. Favored by tricksters, bandits and skirmishers
      for covering an escape.</p>
