      condition: ''
      description: >-
        <p>Setting the trap places a dangerous hazard that deals significant
        damage if triggered. It must be affixed by heavy chain to an immobile
        object, such as a tree or spike driven into the ground. The area of the
        trap is a circle with a radius of 2 feet.</p><p>When triggered, the
        creature that set the trap makes a <strong>Wilderness</strong> skill
        attack against the <strong>Reflex</strong> defense of a single target
        which triggered the trap. If not resisted, it deals
        <strong>Piercing</strong> damage and applies the @Condition[restrained]
        condition. The base damage dealt by the trap varies according to the
        quality of the trap.</p><ul><li><p><strong>Shoddy</strong> - 1
