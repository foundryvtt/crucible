      description: >-
        <p>You hurl the @ref[item.name] into water within 20 feet, and the water
        erupts in a 30 foot <strong>Ray</strong> in a direction of your
        choosing. Creatures in the ray who fail to avoid the blast suffer
        <strong>Bludgeoning</strong> damage and are pushed 15 feet away from the
        eruption. On a @Rule[dice.criticalSuccess], the target is also knocked
        @Condition[prone].</p><p>The base damage of the blast is dependent on
        the quality of the @ref[item.name]:</p><ul><li><p><strong>Shoddy</strong>
